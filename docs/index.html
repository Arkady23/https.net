<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="robots" content="noindex, follow">
   <title>Обход закрытых портов 80 и 443 на IPv4 через редирект с github.com</title>
   <noscript><meta http-equiv="refresh" content="2; url=https://kornienko.ru:8443"></noscript>
   <script>
      const targetPort = (window.location.protocol === "http:") ? "8880" : "8443";
      const urlParams = new URLSearchParams(window.location.search);
      const remainingSearch = urlParams.toString();
      const searchString = remainingSearch ? "?" + remainingSearch : "";
      const redirectUrl = window.location.protocol + "//kornienko.ru:" + targetPort +
                          window.location.pathname + searchString + window.location.hash;
      window.location.replace(redirectUrl);
   </script>
</head>
<body>
   <p>Если перенаправление не произошло автоматически, <a id="manual-link" href="https://kornienko.ru:8443">нажмите сюда</a>.</p>
</body>
</html>
