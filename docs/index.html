<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Обход щакрытых портов 80 и 443 через редирект с github.com</title>
    <script>
        if(window.location.protocol === "http:") {
          const targetProtocol = "http";
          const targetPort = "8880";
        } else {
          const targetProtocol = "https";
          const targetPort = "8443";
        }
        const redirectUrl = targetProtocol + "://a.kornienko.ru:" + targetPort + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(redirectUrl);    </script>
    </script>
</head>
<body>
    <p>Если перенаправление не произошло автоматически, <a id="manual-link" href="#">нажмите сюда</a>.</p>
    <script>
        document.getElementById("manual-link").href = redirectUrl;
    </script>
</body>
</html>
